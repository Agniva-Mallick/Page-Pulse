<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Pulse | Digital Heroes Task</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>Page Pulse</h1>
            <p>Instant SEO & Content Audit</p>
        </header>

        <section class="search-section glass-panel">
            <form id="auditForm" class="search-form">
                <input type="url" id="urlInput" placeholder="https://example.com" required autocomplete="off">
                <button type="submit" id="submitBtn">
                    <span class="btn-text">Audit URL</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </form>
            <div id="errorContainer" class="error-message" style="display: none;"></div>
        </section>

        <section id="resultsSection" class="results-section" style="display: none;">
            <div class="grid">
                <!-- Status & Time -->
                <div class="card glass-panel">
                    <h3>Status</h3>
                    <div class="metric highlight" id="resStatus">--</div>
                </div>
                <div class="card glass-panel">
                    <h3>Response Time</h3>
                    <div class="metric highlight" id="resTime">--</div>
                </div>

                <!-- Page Meta -->
                <div class="card glass-panel span-2">
                    <h3>Page Title</h3>
                    <p class="text-value" id="resTitle">--</p>
                </div>
                <div class="card glass-panel span-2">
                    <h3>Meta Description</h3>
                    <p class="text-value" id="resDesc">--</p>
                </div>

                <!-- Content Metrics -->
                <div class="card glass-panel">
                    <h3>Word Count</h3>
                    <div class="metric" id="resWords">--</div>
                    <p class="sub-text">approximate</p>
                </div>
                <div class="card glass-panel">
                    <h3>H1 Tags</h3>
                    <div class="metric" id="resH1">--</div>
                </div>
                <div class="card glass-panel span-2">
                    <h3>Images Missing Alt</h3>
                    <div class="metric alert" id="resImages">--</div>
                    <p class="sub-text">Accessibility issue</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Built for Digital Heroes Training Task. <a href="https://digitalheroesco.com" target="_blank" rel="noopener noreferrer">digitalheroesco.com</a></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
